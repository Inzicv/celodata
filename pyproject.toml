[project]
name = "celodata"
version = "0.0.1"
description = "Pseudonymisation locale et réversible de documents français avant envoi à une IA"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "presidio-analyzer>=2.2",
]

[project.optional-dependencies]
# Modèles de détection d'entités. Lourds (PyTorch) : installés seulement quand on en a besoin.
modeles = [
    "gliner2>=2.1",
    "gliner>=0.2.13",
    "transformers>=4.40",
    "sentencepiece",
    "protobuf",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
celodata-mesure = "celodata.mesure:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celodata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
