[project]
name = "celodata"
version = "0.0.1"
description = "Pseudonymisation locale et réversible de documents français avant envoi à une IA"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography>=44",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pypdf>=7.1.0",
    "pypdfium2>=5.15.2",
    "python-docx>=1.2.0",
    "pywebview>=6.2.1",
    "regex>=2026.11.9",
    "winrt-runtime>=4.1.0 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-globalization>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-media-ocr>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-security-credentials-ui>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=4!10.0.28000.2957 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Modèles de détection d'entités. Lourds (PyTorch) : installés seulement quand on en a besoin.
modeles = [
    "gliner2>=2.1",
    "gliner>=0.2.13",
    "transformers>=4.40",
    "sentencepiece",
    "protobuf",
]
passerelle = [
    "httpx>=0.28.1",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
celodata-mesure = "celodata.mesure:main"
celodata = "celodata.appli.fenetre:main"
celodata-passerelle = "celodata.passerelle.serveur:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celodata"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
