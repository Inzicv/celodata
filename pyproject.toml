[project]
name = "celodata"
version = "0.0.1"
description = "Pseudonymisation locale et réversible de documents français avant envoi à une IA"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography>=44",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "presidio-analyzer>=2.2",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
# Modèles de détection d'entités. Lourds (PyTorch) : installés seulement quand on en a besoin.
modeles = [
    "gliner2>=2.1",
    "gliner>=0.2.13",
    "transformers>=4.40",
    "sentencepiece",
    "protobuf",
]
passerelle = [
    "httpx>=0.28.1",
    "regex>=2026.11.9",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
celodata-mesure = "celodata.mesure:main"
celodata = "celodata.appli.fenetre:main"
celodata-passerelle = "celodata.passerelle.serveur:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celodata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
